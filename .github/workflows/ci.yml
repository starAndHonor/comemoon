name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | sh
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Check
        run: moon check
      - name: Test (wasm)
        run: moon test
      - name: Test (native)
        run: moon test --target native
      - name: Format check
        run: moon fmt --check
      - name: Regenerate and verify committed output
        run: |
          python3 gen/gen.py lib/user_tracked.mbt /tmp/comemo_gen_check.mbt
          diff /tmp/comemo_gen_check.mbt lib/comemo_gen.mbt
